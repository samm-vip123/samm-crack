<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAMM CRACK - TẠO KEY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:radial-gradient(circle at 50% 0%,#7a0000 0%,#3a0000 30%,#150000 60%,#000 100%);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(#ff003315 1px,transparent 1px) 0 0/50px 50px,linear-gradient(90deg,#ff003315 1px,transparent 1px) 0 0/50px 50px;animation:grid 5s linear infinite;pointer-events:none}
@keyframes grid{to{background-position:50px 50px}}
.box{width:520px;max-width:100%;padding:36px 32px;position:relative;z-index:2;background:linear-gradient(160deg,rgba(255,255,255,0.15) 0%,rgba(255,255,255,0.03) 25%,transparent 50%),linear-gradient(160deg,#5a0000 0%,#2a0000 40%,#1a0000 70%,#3a0000 100%);border-radius:26px;box-shadow:0 0 0 2px #ff0033,0 0 35px #ff0033,0 0 80px #ff0033aa,inset 0 2px 25px rgba(255,255,255,0.25),inset 0 0 70px #ff003340;animation:pulse 2s ease-in-out infinite;overflow:hidden}
.box:before{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{left:-100%}50%,100%{left:150%}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px #ff0033,0 0 35px #ff0033,0 0 80px #ff0033aa,inset 0 2px 25px rgba(255,255,255,0.25),inset 0 0 70px #ff003340}50%{box-shadow:0 0 0 2px #ff3366,0 0 50px #ff0033,0 0 110px #ff0033cc,inset 0 2px 30px rgba(255,255,255,0.35),inset 0 0 90px #ff003360}}
h2{color:#fff;text-align:center;letter-spacing:8px;font-size:28px;font-weight:900;margin-bottom:6px;background:linear-gradient(180deg,#ffffff 0%,#ff3366 50%,#ff0033 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px #ff0033);animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 14px #ff0033)}to{filter:drop-shadow(0 0 25px #ff0033)}}
.sub{color:#ff5566;text-align:center;font-size:10px;letter-spacing:6px;margin-bottom:20px;font-weight:700}
.divider{height:2px;margin:18px 0;background:linear-gradient(90deg,transparent,#ff6688,#ff0033,#ff6688,transparent);box-shadow:0 0 14px #ff0033}
label{display:block;color:#ff8888;font-size:11px;letter-spacing:3px;font-weight:800;margin-bottom:8px}
.inp{width:100%;padding:15px 18px;font-size:15px;letter-spacing:2px;background:linear-gradient(180deg,#0a0000,#250000);border:2px solid #ff003366;border-radius:12px;color:#ff3366;font-weight:700;outline:none;transition:.3s;margin-bottom:16px;box-shadow:inset 0 3px 10px rgba(0,0,0,0.8)}
.inp:focus{border-color:#ff3366;color:#fff;box-shadow:0 0 22px #ff0033,inset 0 0 20px #ff003344}
select.inp{cursor:pointer}
select.inp option{background:#1a0000;color:#ff3366}
.btn{width:100%;padding:17px;font-size:15px;font-weight:900;letter-spacing:5px;color:#fff;border:2px solid #ff8899;border-radius:12px;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,0.5) 0%,transparent 45%),linear-gradient(180deg,#ff3366 0%,#ff0033 50%,#990020 100%);box-shadow:0 0 28px #ff0033,inset 0 2px 14px rgba(255,255,255,0.6);transition:.25s;text-shadow:0 0 12px rgba(255,255,255,0.8)}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 40px #ff0033}
#result{display:none;margin-top:20px;padding:22px;background:linear-gradient(180deg,rgba(255,255,255,0.15),transparent),linear-gradient(180deg,#3a0000,#1a0000);border:2px solid #ff3366;border-radius:16px;box-shadow:0 0 30px #ff0033}
#result.show{display:block;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
#keyOut{font-size:20px;font-weight:900;letter-spacing:2px;text-align:center;color:#fff;padding:16px;border-radius:12px;margin-bottom:14px;background:linear-gradient(180deg,#0a0000,#250000);border:2px dashed #ff3366;text-shadow:0 0 15px #ff0033;user-select:all;word-break:break-all;font-family:monospace}
#info{color:#ff8888;font-size:12px;text-align:center;line-height:1.8;margin-bottom:14px}
#info b{color:#fff}
.mini{display:flex;gap:10px}
.mini button{flex:1;padding:12px;font-size:12px;font-weight:900;letter-spacing:3px;border-radius:10px;cursor:pointer;border:2px solid}
.copy{color:#00e0ff;border-color:#00e0ff;background:linear-gradient(180deg,rgba(0,224,255,0.3),rgba(0,180,220,0.1))}
.copy:hover{background:#00e0ff;color:#001a22;box-shadow:0 0 25px #00e0ff}
.clear{color:#ff5566;border-color:#ff5566;background:linear-gradient(180deg,rgba(255,85,102,0.3),rgba(200,30,50,0.1))}
.clear:hover{background:#ff5566;color:#1a0000;box-shadow:0 0 25px #ff5566}
.stat{margin-top:14px;text-align:center;color:#ff5566;font-size:11px;letter-spacing:2px}
.stat b{color:#00ff88;text-shadow:0 0 8px #00ff88}
</style>
</head>
<body>
<div class="box">
  <h2>KEY GENERATOR</h2>
  <p class="sub">SAMM CRACK</p>
  <div class="divider"></div>

  <label>TÊN KHÁCH</label>
  <input class="inp" id="customer" placeholder="VD: NGUYEN VAN A" maxlength="20">

  <label>THỜI HẠN</label>
  <select class="inp" id="duration">
    <option value="1">1 NGÀY</option>
    <option value="7">7 NGÀY</option>
    <option value="30" selected>30 NGÀY</option>
    <option value="365">1 NĂM</option>
    <option value="0">VĨNH VIỄN</option>
  </select>

  <button class="btn" onclick="genKey()">TẠO KEY</button>

  <div id="result">
    <p style="color:#ff8888;font-size:10px;letter-spacing:3px;text-align:center;margin-bottom:8px">KEY ĐÃ TẠO</p>
    <div id="keyOut">-</div>
    <div id="info"></div>
    <div class="mini">
      <button class="copy" onclick="copyKey()">COPY</button>
      <button class="clear" onclick="reset()">XÓA</button>
    </div>
  </div>

  <div class="stat">TỔNG KEY ĐÃ TẠO: <b id="count">0</b></div>
</div>

<script>
let currentKey = "";

function rand(n){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for(let i=0;i<n;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function genKey(){
  const cust = document.getElementById('customer').value.trim().toUpperCase() || "USER";
  const days = parseInt(document.getElementById('duration').value);
  const key = "SAMM-" + rand(4) + "-" + rand(4) + "-" + rand(4);
  currentKey = key;

  const now = Date.now();
  const exp = days === 0 ? 0 : now + days * 86400000;

  // === LƯU KEY VÀO KHO CHUNG (localStorage) ===
  let keys = JSON.parse(localStorage.getItem('samm_keys') || '[]');
  keys.push({key, cust, days, exp, created: now});
  localStorage.setItem('samm_keys', JSON.stringify(keys));

  const fmt = d => d.toLocaleDateString('vi-VN') + " " + d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});

  document.getElementById('keyOut').textContent = key;
  document.getElementById('info').innerHTML =
    "KHÁCH: <b>" + cust + "</b><br>" +
    "HẠN: <b>" + (days === 0 ? "VĨNH VIỄN" : days + " NGÀY") + "</b><br>" +
    "HẾT HẠN: <b>" + (exp ? fmt(new Date(exp)) : "KHÔNG") + "</b>";
  document.getElementById('result').classList.add('show');
  updateCount();
}

function copyKey(){
  if(!currentKey) return;
  navigator.clipboard.writeText(currentKey).then(()=>{
    const btn = event.target;
    const old = btn.textContent;
    btn.textContent = "✓ ĐÃ COPY";
    setTimeout(()=> btn.textContent = old, 1200);
  });
}

function reset(){
  currentKey = "";
  document.getElementById('result').classList.remove('show');
  document.getElementById('customer').value = "";
}

function updateCount(){
  const keys = JSON.parse(localStorage.getItem('samm_keys') || '[]');
  document.getElementById('count').textContent = keys.length;
}

updateCount();
</script>
</body>
</html>
